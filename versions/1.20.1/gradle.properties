minecraft_version=1.20.1
loader_version=0.20.1
# fabric.mod.json "minecraft" dependency range: 1.20.1 .. 1.20.4 (incl. patch releases).
# "<1.20.5-" also excludes 1.20.5 pre-releases/RCs (which sort below 1.20.5).
mc_dependency=>=1.20.1 <1.20.5-
# Minecraft range shown in the jar file name
mc_range=1.20.1-1.20.4
# Minecraft 1.20.1-1.20.4 runs on Java 17: compiled with --release 17 (see build.gradle.kts for the toolchain)
java_version=17
mixin_compat=JAVA_17
# obfuscated Minecraft: Loom remap plugin + Mojang mappings, jar remapped to intermediary
obf=true
